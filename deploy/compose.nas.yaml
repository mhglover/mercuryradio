# NAS / Portainer deploy — pulls the image CI publishes to GHCR on every push to main
# (and on v* tags). Deploy = "re-pull and redeploy" the stack in Portainer, nothing to
# build or ship by hand. Roll back by pinning MERCURYRADIO_TAG to an earlier version
# tag (each release is tagged; see CHANGELOG.md).
# Set DISCORD_TOKEN, GUILD_ID and MUSIC_DIR (the host path to your library) in the
# stack's Environment — never in this file. No published ports: Discord egress plus a
# read-only library mount.
services:
  mercuryradio:
    image: ghcr.io/mhglover/mercuryradio:${MERCURYRADIO_TAG:-latest}
    pull_policy: always
    container_name: mercuryradio
    restart: always  # fleet rule 2026-09-02: unless-stopped strands a container stopped by a daemon death
    # Finish the current song before exiting on redeploy (DRAIN_TIMEOUT in bot.py);
    # docker SIGKILLs after 10s by default, so give it room.
    stop_grace_period: 330s
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN}
      # Optional: these seed the FIRST server from env on a fresh DB. Otherwise add
      # servers with /setup — config lives in the DB and one process serves many.
      GUILD_ID: ${GUILD_ID:-}
      VOICE_CHANNEL_ID: ${VOICE_CHANNEL_ID:-}
      NOWPLAYING_CHANNEL_ID: ${NOWPLAYING_CHANNEL_ID:-}
      MUSIC_DIR: /music
      DB_PATH: /data/mercuryradio.db
      # /add + /youtube land here — a writable subfolder mounted INSIDE the read-only
      # library, so added tracks become part of the collection (one canonical path, and
      # a media server pointed at the library sees them). The source library stays :ro.
      ADDED_DIR: /music/_Added
      PYTHONUNBUFFERED: "1"  # flush print() to the container log immediately
      # /update (bot-owner-only) asks watchtower below to pull + recreate this
      # container. Leave WATCHTOWER_TOKEN unset to disable the command.
      WATCHTOWER_URL: http://watchtower:8080/v1/update
      WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN:-}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    volumes:
      - ${MUSIC_DIR:?set MUSIC_DIR to your library host path}:/music:ro
      - ${DATA_DIR:?set DATA_DIR to a host dir for the SQLite DB}:/data
      # Writable _Added subfolder nested inside the ro library mount (host path derived
      # from MUSIC_DIR). This is what makes ADDED_DIR above writable.
      - ${MUSIC_DIR}/_Added:/music/_Added

  # On-demand self-update: /update in Discord POSTs to this API; watchtower pulls the
  # image and recreates only labeled containers, and ONLY when the image changed.
  # No schedule — API-only. WATCHTOWER_TIMEOUT must cover the bot's stop_grace_period
  # or an update would SIGKILL mid-song instead of letting the drain finish.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: mercuryradio-watchtower
    restart: always  # fleet rule 2026-09-02: unless-stopped strands a container stopped by a daemon death
    command: --http-api-update --label-enable --cleanup
    environment:
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN:?set WATCHTOWER_TOKEN to enable /update}
      WATCHTOWER_TIMEOUT: 340s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
