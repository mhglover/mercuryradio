# NAS / Portainer deploy — uses a prebuilt image loaded onto the host, not a build context.
# Build locally and ship it registry-free:
#   docker build -t mercuryradio:latest .
#   docker save mercuryradio:latest | ssh nas 'sudo docker load'
# Then deploy this as a Portainer stack; set DISCORD_TOKEN, GUILD_ID and MUSIC_DIR (the host path
# to your library) in the stack's Environment — never in this file. No published ports: Discord
# egress plus a read-only library mount.
services:
  mercuryradio:
    image: mercuryradio:latest
    pull_policy: never
    container_name: mercuryradio
    restart: unless-stopped
    # Finish the current song before exiting on redeploy (DRAIN_TIMEOUT in bot.py);
    # docker SIGKILLs after 10s by default, so give it room.
    stop_grace_period: 330s
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN}
      # Optional: these seed the FIRST server from env on a fresh DB. Otherwise add
      # servers with /setup — config lives in the DB and one process serves many.
      GUILD_ID: ${GUILD_ID:-}
      VOICE_CHANNEL_ID: ${VOICE_CHANNEL_ID:-}
      NOWPLAYING_CHANNEL_ID: ${NOWPLAYING_CHANNEL_ID:-}
      MUSIC_DIR: /music
      DB_PATH: /data/mercuryradio.db
      # /add + /youtube land here — a writable subfolder mounted INSIDE the read-only
      # library, so added tracks become part of the collection (one canonical path, and
      # a media server pointed at the library sees them). The source library stays :ro.
      ADDED_DIR: /music/_Added
      PYTHONUNBUFFERED: "1"  # flush print() to the container log immediately
    volumes:
      - ${MUSIC_DIR:?set MUSIC_DIR to your library host path}:/music:ro
      - ${DATA_DIR:?set DATA_DIR to a host dir for the SQLite DB}:/data
      # Writable _Added subfolder nested inside the ro library mount (host path derived
      # from MUSIC_DIR). This is what makes ADDED_DIR above writable.
      - ${MUSIC_DIR}/_Added:/music/_Added
