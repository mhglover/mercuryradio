# NAS / Portainer deploy — uses a prebuilt image loaded onto the host, not a build context.
# Build locally and ship it registry-free:
#   docker build -t mercuryradio:latest .
#   docker save mercuryradio:latest | ssh nas 'sudo docker load'
# Then deploy this as a Portainer stack; set DISCORD_TOKEN, GUILD_ID and MUSIC_DIR (the host path
# to your library) in the stack's Environment — never in this file. No published ports: Discord
# egress plus a read-only library mount.
services:
  mercuryradio:
    image: mercuryradio:latest
    pull_policy: never
    container_name: mercuryradio
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN}
      GUILD_ID: ${GUILD_ID:?set GUILD_ID}
      VOICE_CHANNEL_ID: ${VOICE_CHANNEL_ID:-}
      MUSIC_DIR: /music
      DB_PATH: /data/mercuryradio.db
      PYTHONUNBUFFERED: "1"  # flush print() to the container log immediately
    volumes:
      - ${MUSIC_DIR:?set MUSIC_DIR to your library host path}:/music:ro
      - ${DATA_DIR:?set DATA_DIR to a host dir for the SQLite DB}:/data
