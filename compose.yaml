# No published ports — just Discord egress and a read-only bind mount of your
# music library.
#
# Set DISCORD_TOKEN, GUILD_ID and MUSIC_DIR in a .env file next to this one (or
# in Portainer's stack environment). MUSIC_DIR is the host path to your library.
services:
  mercuryradio:
    build: .
    image: mercuryradio
    container_name: mercuryradio
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN}
      GUILD_ID: ${GUILD_ID:?set GUILD_ID}
      VOICE_CHANNEL_ID: ${VOICE_CHANNEL_ID:-}
      NOWPLAYING_CHANNEL_ID: ${NOWPLAYING_CHANNEL_ID:-}
      MUSIC_DIR: /music
      DB_PATH: /data/mercuryradio.db
      PYTHONUNBUFFERED: "1"  # flush print() to the container log immediately
    volumes:
      - ${MUSIC_DIR:?set MUSIC_DIR to your library path}:/music:ro
      - ${DATA_DIR:-./data}:/data
