name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with pytest pytest -q

  # Publish to GHCR on main (":latest") and on v* tags (":<tag>"), never for PRs.
  # Multi-arch so the image runs on an amd64 NAS and an arm64 box alike.
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
      # Phone ping on a successful publish — "safe to /update now". Runs only when the
      # NTFY_URL secret is set (the full https://ntfy.sh/<topic> URL), so forks and
      # secretless clones skip it silently. Never fails the build.
      - name: notify phone
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          [ -z "$NTFY_URL" ] && exit 0
          curl -s -m 10 -d "mercuryradio ${{ github.ref_name }} published — /update ready" "$NTFY_URL" >/dev/null || true
